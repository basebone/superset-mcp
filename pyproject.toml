[project]
name = "superset-mcp"
version = "0.1.0"
description = "Model Control Protocol (MCP) server for Apache Superset integration with AI assistants"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Superset MCP Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    # Capped below 2. mcp 2.0 renamed FastMCP to MCPServer, so a resolver free to take
    # the newest major installs a server that fails at import -- which is what happened to
    # google-ads-mcp: the lock resolved 2.1.1 and the entry point died before serving a
    # request.
    "mcp[cli]>=1.29.1,<2",
    "pydantic>=2.0.0",
    "starlette>=0.36.0",
    "anyio>=4.0",
    "uvicorn>=0.34.0",
    "python-dotenv>=1.0.0",
    "PyJWT>=2.8.0",
]
# esme_mcp, the OAuth authorization server every remote MCP here runs, is on no index, so
# it is not declared here: setup.sh installs it from its repository at the tag the
# Makefile names. google-auth, requests and cryptography are its to declare, not this
# project's. It is also why requires-python is 3.11: esme_mcp uses `X | None` in
# annotations that pydantic evaluates at runtime.

[tool.setuptools]
py-modules = ["main", "http_config_env"]

[project.urls]
Homepage = "https://github.com/yourusername/superset-mcp"
Issues = "https://github.com/yourusername/superset-mcp/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
